[project]
name = "wre-workspace"
version = "0.1.0"
description = "Python workspace for the Web Research Engine"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "pip-audit>=2.8,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-socket>=0.7,<1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/wre_pipeline/src"]
