[project]
name = "wre-enricher"
version = "0.1.0"
description = "Web Research Engine enricher service"
requires-python = ">=3.12"
dependencies = ["wre-pipeline"]

[project.scripts]
wre-enricher = "wre_enricher.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
wre-pipeline = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/wre_enricher"]
