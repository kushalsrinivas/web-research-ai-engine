[project]
name = "wre-parser"
version = "0.1.0"
description = "Web Research Engine parser service"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.3,<4",
    "defusedxml>=0.7,<1",
    "feedparser>=6.0,<7",
    "jsonschema>=4.23,<5",
    "lxml>=5,<7",
    "minio>=7.2,<8",
    "psycopg[binary,pool]>=3.2,<4",
    "py3langid>=0.2,<1",
    "pymupdf>=1.25,<2",
    "python-dateutil>=2.9,<3",
    "python-docx>=1.1,<2",
    "trafilatura>=2.0,<3",
    "wre-pipeline",
]

[project.scripts]
wre-parser = "wre_parser.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
wre-pipeline = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/wre_parser"]
